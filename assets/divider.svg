<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 12" width="100%" height="12" style="background: transparent;">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="15%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0)" />
    </linearGradient>
  </defs>
  <style>
    @keyframes lineGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .div-line { animation: lineGlow 3s ease-in-out indefinite; }
  </style>
  <rect class="div-line" x="0" y="5" width="850" height="2" rx="1" fill="url(#divGrad)" />
</svg>
